<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Telltale</title>
    <link rel="stylesheet" href="/assets/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23163a36'/%3E%3Cpath d='M9 7v18M9 9c6 0 9 3 14 3M9 15c5 0 8 2 12 2' stroke='%237ee0c8' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="7" class="brand-tile" />
          <path d="M9 7v18M9 9c6 0 9 3 14 3M9 15c5 0 8 2 12 2" class="brand-mark" />
        </svg>
        <span>Telltale</span>
        <span class="project" id="project-name"></span>
      </div>
      <nav id="nav">
        <a href="#/ideas" data-view="ideas">Ideas</a>
        <a href="#/kpis" data-view="kpis">KPIs</a>
        <a href="#/behaviour" data-view="behaviour">Behaviour</a>
        <a href="#/setup" data-view="setup">Setup</a>
      </nav>
      <button class="primary" id="run-analysis" type="button">Run analysis</button>
    </header>
    <main id="view" aria-live="polite"></main>
    <div class="toast" id="toast" role="status" hidden></div>
    <script src="/assets/app.js"></script>
  </body>
</html>
