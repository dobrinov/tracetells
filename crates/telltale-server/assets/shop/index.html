<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stride: running shoes</title>
    <!-- The only thing a site needs to be instrumented with Telltale: -->
    <script src="{{TELLTALE_URL}}/t.js" data-key="{{WRITE_KEY}}" defer></script>
    <script src="/shop.js" defer></script>
    <style>
      :root {
        --bg: #fbfaf7;
        --surface: #ffffff;
        --ink: #1d1b18;
        --muted: #6f6a62;
        --line: #e8e4dc;
        --brand: #e0482d;
        --brand-ink: #ffffff;
        --soft: #f3efe7;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141311;
          --surface: #1c1a17;
          --ink: #f1ede6;
          --muted: #a59f95;
          --line: #2e2b26;
          --brand: #ff6a4d;
          --brand-ink: #1a0d09;
          --soft: #24211d;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      a {
        color: inherit;
      }
      .demo-bar {
        background: #163a36;
        color: #d9f5ee;
        font-size: 13px;
        padding: 8px 16px;
        text-align: center;
      }
      .demo-bar a {
        color: #7ee0c8;
        font-weight: 600;
      }
      header {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 14px 24px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
        flex-wrap: wrap;
      }
      .logo {
        font-weight: 800;
        font-size: 20px;
        letter-spacing: -0.02em;
        text-decoration: none;
      }
      .logo span {
        color: var(--brand);
      }
      header nav {
        display: flex;
        gap: 16px;
        flex: 1;
      }
      header nav a {
        text-decoration: none;
        color: var(--muted);
      }
      header nav a:hover {
        color: var(--ink);
      }
      .cart-link {
        text-decoration: none;
        font-weight: 600;
      }
      main {
        max-width: 1040px;
        margin: 0 auto;
        padding: 32px 24px 80px;
      }
      h1 {
        font-size: 34px;
        letter-spacing: -0.02em;
        margin: 0 0 8px;
      }
      .lead {
        color: var(--muted);
        margin: 0 0 28px;
        max-width: 60ch;
      }
      .btn {
        display: inline-block;
        font: inherit;
        font-weight: 650;
        border: 0;
        border-radius: 999px;
        padding: 12px 22px;
        background: var(--brand);
        color: var(--brand-ink);
        cursor: pointer;
        text-decoration: none;
      }
      .btn.secondary {
        background: var(--soft);
        color: var(--ink);
      }
      .hero {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 32px;
        align-items: center;
        padding: 24px 0 40px;
      }
      .hero img {
        width: 100%;
        border-radius: 20px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 18px;
      }
      .product-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
      }
      /* Planted problem: the image looks clickable but does nothing. */
      .product-card > img {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        cursor: pointer;
        transition: transform 0.2s;
      }
      .product-card > img:hover {
        transform: scale(1.03);
      }
      .product-card .info {
        padding: 12px 16px 16px;
      }
      .product-card h3 {
        margin: 0;
        font-size: 17px;
      }
      .price {
        font-weight: 700;
      }
      .muted {
        color: var(--muted);
      }
      .detail {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 32px;
      }
      .detail img {
        width: 100%;
        border-radius: 20px;
      }
      .sizes {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 16px 0 24px;
      }
      .sizes button {
        font: inherit;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        border-radius: 10px;
        padding: 8px 12px;
        cursor: pointer;
      }
      .sizes button.on {
        border-color: var(--ink);
        font-weight: 700;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 20px 24px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }
      .row:last-child {
        border-bottom: 0;
      }
      .plans {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 18px;
        margin-top: 20px;
      }
      .toggle {
        display: inline-flex;
        background: var(--soft);
        border-radius: 999px;
        padding: 4px;
      }
      .toggle button {
        font: inherit;
        border: 0;
        background: none;
        color: var(--ink);
        padding: 8px 16px;
        border-radius: 999px;
        cursor: pointer;
      }
      .toggle button.on {
        background: var(--surface);
        font-weight: 650;
      }
      form.signup {
        display: grid;
        gap: 14px;
        max-width: 520px;
      }
      form.signup label {
        display: grid;
        gap: 4px;
        font-size: 14px;
        color: var(--muted);
      }
      form.signup input,
      form.signup select {
        font: inherit;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .error {
        color: var(--brand);
        font-weight: 600;
      }
      footer {
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        padding: 24px;
      }
      @media (max-width: 720px) {
        .hero,
        .detail {
          grid-template-columns: 1fr;
        }
        h1 {
          font-size: 28px;
        }
        main {
          padding: 24px 16px 64px;
        }
        header {
          padding: 12px 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="demo-bar">
      Demo shop instrumented with Telltale. Click around, then
      <a href="{{TELLTALE_URL}}/#/behaviour" target="_blank" rel="noopener">see what Telltale recorded →</a>
    </div>
    <header>
      <a class="logo" href="/" data-link>Stride<span>.</span></a>
      <nav>
        <a href="/products" data-link>Shoes</a>
        <a href="/pricing" data-link>Stride+</a>
        <a href="/signup" data-link>Sign up</a>
      </nav>
      <a class="cart-link" href="/cart" data-link>Cart (<span id="cart-count">0</span>)</a>
    </header>
    <main id="app"></main>
    <footer>Stride is a fictional shop. Nothing here is for sale.</footer>
  </body>
</html>
