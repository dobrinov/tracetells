<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trace</title>
    <script>
      // Apply the saved theme before the first paint; "system" follows the OS.
      try {
        var t = localStorage.getItem("trace_theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/assets/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310141d'/%3E%3Crect x='9.2' y='26.4' width='11.2' height='11.2' rx='3.6' fill='%2345c75b'/%3E%3Crect x='18.8' y='23.2' width='17.6' height='17.6' rx='4.8' fill='%232a9ba3' stroke='%2310141d' stroke-width='2.1'/%3E%3Crect x='31.2' y='20' width='24' height='24' rx='6.4' fill='%234a6cff' stroke='%2310141d' stroke-width='2.1'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="shell">
      <nav class="places" id="places" aria-label="Website">
        <div class="places-top">
          <a class="brand" href="#/pulse" aria-label="Trace, Pulse">
            <svg class="logo" viewBox="2 15.5 60 33" aria-hidden="true">
              <rect x="3.5" y="25" width="14" height="14" rx="4.5" fill="#45c75b" />
              <rect x="13.5" y="21" width="22" height="22" rx="6" fill="#2a9ba3" class="ring" />
              <rect x="30.5" y="17" width="30" height="30" rx="8" fill="#4a6cff" class="ring" />
            </svg>
            <span>Trace</span>
          </a>
          <div class="site-menu" id="site-menu" data-trace-mask hidden>
            <button type="button" class="site-button" id="site-button" aria-haspopup="listbox" aria-expanded="false">
              <span class="dot" id="site-dot"></span>
              <span id="site-name"></span>
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10l5 5 5-5" /></svg>
            </button>
            <div class="site-list" id="site-list" role="listbox" aria-label="Websites" hidden></div>
          </div>
          <button type="button" class="places-toggle" id="places-toggle" aria-expanded="false" aria-controls="places-body" aria-label="Menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
          </button>
        </div>
        <div class="places-body" id="places-body">
          <a class="collect-status" id="collect-status" href="#/settings/install" hidden></a>
          <div class="places-list" id="nav"></div>
          <div class="places-foot">
            <button id="run-analysis" type="button" title="Copies /trace:analyse for your coding agent" hidden>Analyse</button>
            <div id="settings-link"></div>
            <a class="place" href="/admin" data-view="admin" hidden>Admin</a>
            <a class="place me" id="me" href="#/account" data-view="account" data-trace-mask hidden></a>
          </div>
        </div>
      </nav>
      <div class="content">
        <div class="viewing-as" id="viewing-as" role="status" data-trace-mask hidden></div>
        <div class="notice" id="notice" role="status" data-trace-mask hidden></div>
        <nav class="subnav" id="subnav" aria-label="Views" hidden></nav>
        <main id="view" aria-live="polite" data-trace-mask></main>
      </div>
    </div>
    <nav class="tabbar" id="tabbar" aria-label="Places"></nav>
    <div class="toast" id="toast" role="status" data-trace-mask hidden></div>
    <script src="/assets/app/core.js"></script>
    <script src="/assets/app/insights.js"></script>
    <script src="/assets/app/goals.js"></script>
    <script src="/assets/app/analysis.js"></script>
    <script src="/assets/app/home.js"></script>
    <script src="/assets/app/pulse.js"></script>
    <script src="/assets/app/pages.js"></script>
    <script src="/assets/app/story.js"></script>
    <script src="/assets/app/errors.js"></script>
    <script src="/assets/app/setup.js"></script>
    <script src="/assets/app/accounts.js"></script>
    <script src="/assets/app/settings.js"></script>
    <script src="/assets/app/audience.js"></script>
    <script src="/assets/app/features.js"></script>
    <script src="/assets/app/boot.js"></script>
  </body>
</html>
