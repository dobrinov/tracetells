<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trace</title>
    <script>
      // Apply the saved theme before the first paint; "system" follows the OS.
      try {
        var t = localStorage.getItem("trace_theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/assets/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310141d'/%3E%3Crect x='9.2' y='26.4' width='11.2' height='11.2' rx='3.6' fill='%2345c75b'/%3E%3Crect x='18.8' y='23.2' width='17.6' height='17.6' rx='4.8' fill='%232a9ba3' stroke='%2310141d' stroke-width='2.1'/%3E%3Crect x='31.2' y='20' width='24' height='24' rx='6.4' fill='%234a6cff' stroke='%2310141d' stroke-width='2.1'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <svg class="logo" viewBox="2 15.5 60 33" aria-hidden="true">
          <rect x="3.5" y="25" width="14" height="14" rx="4.5" fill="#45c75b" />
          <rect x="13.5" y="21" width="22" height="22" rx="6" fill="#2a9ba3" class="ring" />
          <rect x="30.5" y="17" width="30" height="30" rx="8" fill="#4a6cff" class="ring" />
        </svg>
        <span>Trace</span>
      </div>
      <div class="site-menu" id="site-menu" data-trace-mask hidden>
        <button type="button" class="site-button" id="site-button" aria-haspopup="listbox" aria-expanded="false">
          <span class="dot" id="site-dot"></span>
          <span id="site-name"></span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10l5 5 5-5" /></svg>
        </button>
        <div class="site-list" id="site-list" role="listbox" aria-label="Websites" hidden></div>
      </div>
      <nav id="nav" aria-label="Areas">
        <a href="#/home" data-section="home">Home</a>
        <a href="#/understand" data-section="understand">Understand</a>
        <a href="#/improve" data-section="improve">Improve</a>
        <a href="#/setup" data-section="setup" class="nav-setup">Setup<span class="progress" id="start-progress" hidden></span></a>
        <a href="/admin" data-view="admin" hidden>Admin</a>
      </nav>
      <a class="collect-status" id="collect-status" href="#/setup/install" hidden></a>
      <button id="run-analysis" type="button">Run analysis</button>
      <a class="me" id="me" href="#/account" data-view="account" data-trace-mask hidden></a>
    </header>
    <nav class="subnav" id="subnav" aria-label="Pages" hidden></nav>
    <div class="viewing-as" id="viewing-as" role="status" data-trace-mask hidden></div>
    <div class="notice" id="notice" role="status" data-trace-mask hidden></div>
    <main id="view" aria-live="polite" data-trace-mask></main>
    <div class="toast" id="toast" role="status" data-trace-mask hidden></div>
    <script src="/assets/app.js"></script>
  </body>
</html>
