name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "crates/trace-server/assets/shop/**"
      - "deploy/build-site.sh"
      - "deploy/render-site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      # The marketing site plus the Stride demo shop at /demo. Write keys and
      # public links are public by nature: they're in every page that uses them.
      - name: Build
        run: deploy/build-site.sh _site
        env:
          TRACE_URL: https://app.tracetells.com
          SHOP_WRITE_KEY: fd18072a76b648048a5ea5b1ac274b10
          SHOP_PUBLIC_URL: https://app.tracetells.com/p/uDVoTzUDXjSybPZF5ANLG78-USVvW2TU
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
