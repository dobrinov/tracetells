name: Bug report
description: Report a bug together with an OpenSpec change that fixes it (explore + propose).
title: "[bug] "
labels: [bug, openspec]
body:
  - type: markdown
    attributes:
      value: |
        **Bug report.** Describe what happens, what should happen and how to reproduce it in the proposal; add a spec scenario that fails today. Diagnostic takes contributions as **OpenSpec changes**: explore the problem, then propose it.
        The quickest way is to run `scripts/openspec-issue.sh <change-id>`, which validates your change and opens this issue for you.
        See [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) for the steps.

        Found a security problem? Please **don't** open an issue: see [SECURITY.md](../blob/main/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: Diagnostic version
      description: Output of `diagnostic --version`, or the commit you ran.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and OS for collector bugs; OS and how you run the server for server bugs.

  - type: input
    id: change-id
    attributes:
      label: Change id
      description: The kebab-case name of your OpenSpec change (the folder under openspec/changes/).
      placeholder: add-funnel-kpi
    validations:
      required: true
  - type: textarea
    id: exploration
    attributes:
      label: Exploration
      description: |
        What `/opsx:explore` found: the problem as you mapped it, the modules and files involved and how they behave today, and alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: proposal.md
      description: The full contents of `openspec/changes/<id>/proposal.md`, including the Privacy impact and Site impact sections.
    validations:
      required: true
  - type: textarea
    id: specs
    attributes:
      label: Spec deltas
      description: |
        Every file under `openspec/changes/<id>/specs/`. Start each file with a line like
        `<!-- file: specs/<capability>/spec.md -->`, then paste its contents.
      value: |
        <!-- file: specs/CAPABILITY/spec.md -->
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: design.md
      description: The contents of `design.md`, or leave empty if the change didn't need one.
  - type: textarea
    id: tasks
    attributes:
      label: tasks.md
      description: The contents of `tasks.md`.
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I ran `/opsx:explore` and `/opsx:propose` (or wrote the same artifacts by hand) against the current `main`.
          required: true
        - label: "`openspec validate <change-id> --strict` passes."
          required: true
        - label: The proposal states its privacy impact and its effect on visitors' browsers.
          required: true
        - label: Nothing in this issue contains personal data, secrets or real customer information.
          required: true
